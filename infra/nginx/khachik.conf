# Place on the EC2 host at /etc/nginx/conf.d/khachik.conf
# After Certbot, HTTPS server blocks will be added automatically.

upstream khachik_api {
  server 127.0.0.1:4000;
}

upstream khachik_admin {
  server 127.0.0.1:8080;
}

server {
  listen 80;
  server_name api.yourdomain.com;

  client_max_body_size 2048m;

  location / {
    proxy_pass http://khachik_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 80;
  server_name admin.yourdomain.com;

  location / {
    proxy_pass http://khachik_admin;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
