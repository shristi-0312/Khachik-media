# Minimal Ubuntu Nginx config (PM2 API + admin SPA).
#
#   sudo cp infra/nginx/khachik-pm2.conf /etc/nginx/sites-available/khachik
#   sudo ln -sf /etc/nginx/sites-available/khachik /etc/nginx/sites-enabled/khachik
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# URLs:
#   http://SERVER_IP/admin/     → admin SPA
#   http://SERVER_IP/api/...    → API (PM2 on :4000)

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  # Films/HQ originals can be large; uploads proxy through /api → S3
  client_max_body_size 2048m;
  root /var/www/html;

  # API — strip /api prefix → Node on :4000
  location /api/ {
    proxy_pass http://127.0.0.1:4000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
  }

  # Admin SPA (Vite base = /admin/)
  location /admin/ {
    try_files $uri $uri/ /admin/index.html;
  }

  location = /admin {
    return 302 /admin/;
  }

  location = / {
    return 302 /admin/;
  }
}
