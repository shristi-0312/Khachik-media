services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-khachik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-khachik}
      POSTGRES_DB: ${POSTGRES_DB:-khachik}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-khachik}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../khachik-media-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-khachik}:${POSTGRES_PASSWORD:-khachik}@db:5432/${POSTGRES_DB:-khachik}?schema=public
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      S3_BUCKET: ${S3_BUCKET}
      CLOUDFRONT_URL: ${CLOUDFRONT_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL:-contact@khachikmedia.com}
      CONTACT_FROM_EMAIL: ${CONTACT_FROM_EMAIL:-Khachik Media <noreply@khachikmedia.com>}
    ports:
      - '4000:4000'

  admin:
    build:
      context: ../khachik-media-admin
      args:
        VITE_API_URL: ${PUBLIC_API_URL}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '8080:80'

volumes:
  postgres_data:
