name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: Build API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: khachik-media-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: khachik-media-api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build

  admin:
    name: Build Admin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: khachik-media-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: khachik-media-admin/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: https://3-108-244-235.sslip.io/api

  site:
    name: Build Site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: khachik-media-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: khachik-media-site/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: https://3-108-244-235.sslip.io/api
