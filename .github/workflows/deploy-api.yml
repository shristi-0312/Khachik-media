name: Deploy API + Admin

on:
  push:
    branches: [main]
    paths:
      - 'khachik-media-api/**'
      - 'khachik-media-admin/**'
      - 'infra/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

concurrency:
  group: deploy-api-admin
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 25m
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/khachik-media
            git fetch origin
            git reset --hard origin/main
            bash infra/scripts/deploy-pm2.sh
